<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%80%3C/text%3E%3C/svg%3E">
<title>QR-Магия ✨ Твой волшебный генератор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --pink-milk:#FFF8F8;
    --pink-powder:#FFD9E8;
    --pink-fuchsia:#FF5DA8;
    --pink-fuchsia-dark:#E8388C;
    --champagne:#F7E8CE;
    --lavender:#EAE0FF;
    --gold:#E8B94E;
    --ink:#5A3A4A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 15% 20%, var(--lavender) 0%, transparent 40%),
      radial-gradient(circle at 85% 15%, var(--champagne) 0%, transparent 35%),
      radial-gradient(circle at 90% 85%, var(--pink-powder) 0%, transparent 45%),
      var(--pink-milk);
    font-family:'Comfortaa', cursive, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,.heading{font-family:'Fredoka', sans-serif; font-weight:700;}

  /* floating decorations */
  .deco{position:fixed; pointer-events:none; opacity:.5; user-select:none; z-index:0;}
  .deco span{display:inline-block; animation: drift 7s ease-in-out infinite;}
  .d1{top:8%; left:6%; font-size:34px;}
  .d2{top:14%; right:8%; font-size:28px;}
  .d3{bottom:10%; left:9%; font-size:30px;}
  .d4{bottom:16%; right:10%; font-size:26px;}
  .d5{top:45%; left:2%; font-size:22px;}
  .d6{top:50%; right:3%; font-size:24px;}
  .d2 span, .d4 span, .d6 span{animation-delay:1.4s;}
  .d3 span{animation-delay:2.6s;}
  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(-4deg);}
    50%{transform:translateY(-14px) rotate(6deg);}
  }

  .card{
    position:relative; z-index:1;
    width:100%; max-width:440px;
    background: rgba(255,255,255,.86);
    backdrop-filter: blur(6px);
    border-radius:32px;
    padding:36px 28px 30px;
    box-shadow: 0 18px 40px -12px rgba(255,93,168,.35), 0 2px 0 #fff inset;
    border: 1px solid rgba(255,217,232,.9);
    text-align:center;
    animation: riseIn .7s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(18px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--lavender); color:var(--pink-fuchsia-dark);
    font-size:12px; font-weight:600; padding:6px 14px; border-radius:999px;
    margin-bottom:14px;
  }

  .mascot{width:84px; height:auto; margin:0 auto 10px; display:block; filter:drop-shadow(0 6px 10px rgba(255,93,168,.35));}
  h1{font-size:26px; margin:0 0 6px; line-height:1.25;}
  .sub{font-size:13.5px; opacity:.75; margin:0 0 26px;}

  .field{
    text-align:left;
    background:#fff;
    border:2px solid var(--pink-powder);
    border-radius:20px;
    padding:14px 18px;
    margin-bottom:16px;
    transition: border-color .25s, box-shadow .25s;
  }
  .field:focus-within{
    border-color:var(--pink-fuchsia);
    box-shadow:0 0 0 4px rgba(255,93,168,.15);
  }
  .field label{display:block; font-size:11px; font-weight:600; letter-spacing:.02em; color:var(--pink-fuchsia-dark); margin-bottom:4px;}
  .field input{
    width:100%; border:none; outline:none; font-family:'Comfortaa',sans-serif;
    font-size:15px; background:transparent; color:var(--ink);
  }
  .field input::placeholder{color:#c99bb0;}

  .btn-main{
    width:100%;
    background: linear-gradient(135deg, var(--pink-fuchsia), var(--pink-fuchsia-dark));
    color:#fff; border:none; border-radius:20px;
    padding:15px 18px; font-family:'Fredoka',sans-serif; font-weight:700; font-size:16px;
    cursor:pointer; box-shadow:0 10px 22px -8px rgba(232,56,140,.6);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn-main:hover{transform:translateY(-2px) rotate(-.3deg); box-shadow:0 14px 26px -8px rgba(232,56,140,.7);}
  .btn-main:active{transform:translateY(0) scale(.98);}

  .hint{font-size:12px; color:var(--pink-fuchsia-dark); margin-top:10px; min-height:16px;}

  .result{
    margin-top:26px; display:none;
  }
  .result.show{display:block; animation: riseIn .5s ease;}
  .qr-frame{
    width:fit-content; margin:0 auto 16px;
    background:#fff; padding:16px; border-radius:24px;
    border:3px dashed var(--pink-powder);
    box-shadow:0 8px 20px -10px rgba(255,93,168,.4);
  }
  .qr-frame canvas{display:block; border-radius:12px;}

  .btn-download{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--champagne); color:var(--ink);
    border:none; border-radius:16px; padding:10px 20px;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer; transition: transform .15s;
  }
  .btn-download:hover{transform:translateY(-1px);}

  .footer-note{margin-top:22px; font-size:11px; opacity:.55;}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(90,58,74,.35);
    display:none; align-items:center; justify-content:center; z-index:20; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    position:relative; background:#fff; border-radius:28px; padding:32px 26px 26px;
    max-width:360px; width:100%; text-align:center;
    box-shadow:0 24px 60px -18px rgba(232,56,140,.5);
    animation: pop .45s cubic-bezier(.3,1.4,.4,1);
    overflow:hidden;
  }
  @keyframes pop{
    from{opacity:0; transform:scale(.8) translateY(10px);}
    to{opacity:1; transform:scale(1) translateY(0);}
  }
  .modal h2{font-size:19px; margin:6px 0 14px;}
  .wish{
    background:var(--lavender); border-radius:18px; padding:16px 14px;
    font-size:14px; line-height:1.5; margin-bottom:20px;
  }
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{
    flex:1; border:none; border-radius:16px; padding:11px 10px;
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .btn-again{background:var(--pink-fuchsia); color:#fff;}
  .btn-close{background:var(--pink-milk); color:var(--ink); border:1.5px solid var(--pink-powder) !important;}

  .confetti{position:absolute; font-size:20px; top:-20px; animation: fall 2.6s ease-in forwards;}
  @keyframes fall{
    to{ transform: translateY(340px) rotate(200deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

<div class="deco d1"><span>💗</span></div>
<div class="deco d2"><span>✨</span></div>
<div class="deco d3"><span>🎀</span></div>
<div class="deco d4"><span>⭐</span></div>
<div class="deco d5"><span>☁️</span></div>
<div class="deco d6"><span>💫</span></div>

<main class="card">
  <span class="badge">♡ бесплатно и без лимитов навсегда</span>
  <svg class="mascot" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="52" rx="34" ry="30" fill="#fff" stroke="#F5B9D1" stroke-width="2.5"/>
    <path d="M20 30 L14 8 L34 22 Z" fill="#fff" stroke="#F5B9D1" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M80 30 L86 8 L66 22 Z" fill="#fff" stroke="#F5B9D1" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="34" cy="50" rx="3.6" ry="4.4" fill="#5A3A4A"/>
    <ellipse cx="66" cy="50" rx="3.6" ry="4.4" fill="#5A3A4A"/>
    <ellipse cx="50" cy="58" rx="3" ry="2.2" fill="#FF9EC4"/>
    <path d="M14 56 Q0 54 8 50 M14 60 Q-2 60 8 58 M14 64 Q0 68 8 66" stroke="#E8B2C6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M86 56 Q100 54 92 50 M86 60 Q102 60 92 58 M86 64 Q100 68 92 66" stroke="#E8B2C6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g transform="translate(66,26) rotate(18)">
      <path d="M0 0 L10 -6 L8 2 L10 8 Z" fill="#FF5DA8"/>
      <path d="M0 0 L-10 -6 L-8 2 L-10 8 Z" fill="#FF5DA8"/>
      <circle cx="0" cy="0" r="3.2" fill="#E8388C"/>
    </g>
  </svg>
  <h1>Создай свой волшебный QR-код ✨</h1>
  <p class="sub">Вставь любую ссылку — получи миленький QR-код за секунду</p>

  <div class="field">
    <label for="url-input">ССЫЛКА</label>
    <input id="url-input" type="text" placeholder="Вставь свою чудесную ссылку сюда... ♡" autocomplete="off">
  </div>

  <button class="btn-main" id="generate-btn">Создать магию ✨</button>
  <div class="hint" id="hint"></div>

  <div class="result" id="result">
    <div class="qr-frame">
      <canvas id="qr-canvas" width="240" height="240"></canvas>
    </div>
    <button class="btn-download" id="download-btn">⬇ Скачать PNG</button>
  </div>

  <p class="footer-note">Всё работает прямо в твоём браузере — без регистрации и водяных знаков 🧸</p>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <h2>Твой волшебный QR-код готов! 🎉</h2>
    <div class="wish" id="wish-text"></div>
    <div class="modal-actions">
      <button class="btn-again" id="again-btn">Создать ещё ✨</button>
      <button class="btn-close" id="close-btn">Закрыть</button>
    </div>
  </div>
</div>

<script>
const wishes = [
  "Ты сегодня выглядишь потрясающе! Пусть этот день принесёт только радость! 🌸",
  "У тебя всё получится! Верь в себя, моя хорошая ✨",
  "Время сиять! Пусть твоя ссылка разлетится по всему миру 💕",
  "Маленький шаг к большим мечтам! Обнимаю крепко-крепко 🧸",
  "Пусть твой день будет сладким, как клубничный зефир 🍓"
];

const input = document.getElementById('url-input');
const genBtn = document.getElementById('generate-btn');
const hint = document.getElementById('hint');
const result = document.getElementById('result');
const canvas = document.getElementById('qr-canvas');
const downloadBtn = document.getElementById('download-btn');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const wishText = document.getElementById('wish-text');
const againBtn = document.getElementById('again-btn');
const closeBtn = document.getElementById('close-btn');

let qr;

function makeQr(value){
  try{
    qr = new QRious({
      element: canvas,
      value: value,
      size: 240,
      background: '#ffffff',
      foreground: '#5A3A4A',
      level: 'H'
    });
    return true;
  }catch(e){
    return false;
  }
}

function shake(el){
  el.style.transition = 'transform .08s';
  let n = 0;
  const iv = setInterval(()=>{
    el.style.transform = `translateX(${n%2===0?6:-6}px)`;
    n++;
    if(n>5){ clearInterval(iv); el.style.transform=''; }
  }, 60);
}

function spawnConfetti(){
  const hearts = ['💗','💖','✨','🎀','⭐'];
  for(let i=0;i<10;i++){
    const el = document.createElement('span');
    el.className = 'confetti';
    el.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    el.style.left = (10 + Math.random()*80) + '%';
    el.style.animationDelay = (Math.random()*0.4)+'s';
    modal.appendChild(el);
    setTimeout(()=>el.remove(), 3200);
  }
}

function generate(){
  const value = input.value.trim();
  if(!value){
    hint.textContent = 'Впиши ссылку, моя хорошая — без неё магия не сработает ♡';
    shake(input.parentElement);
    return;
  }
  hint.textContent = '';
  const ok = makeQr(value);
  if(!ok){
    hint.textContent = 'Ой, что-то пошло не так — попробуй другую ссылку';
    return;
  }
  result.classList.add('show');
  wishText.textContent = wishes[Math.floor(Math.random()*wishes.length)];
  overlay.classList.add('show');
  spawnConfetti();
}

genBtn.addEventListener('click', generate);
input.addEventListener('keydown', e=>{ if(e.key==='Enter') generate(); });

downloadBtn.addEventListener('click', ()=>{
  const link = document.createElement('a');
  link.download = 'qr-magic.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

closeBtn.addEventListener('click', ()=> overlay.classList.remove('show'));
againBtn.addEventListener('click', ()=>{
  overlay.classList.remove('show');
  input.focus();
  input.select();
});
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('show'); });
</script>
</body>
</html>
