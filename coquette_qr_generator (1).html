<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty QR Generator ♡</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Fredoka:wght@600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kitty: {
                            50: '#fff0f5',
                            100: '#ffe1ec',
                            200: '#fcc2d7',
                            300: '#faa2c1',
                            400: '#f76b9a',
                            500: '#f03e3e',
                            600: '#e62269',
                            700: '#a61e4d',
                            800: '#520c28',
                            900: '#3d091d',
                        }
                    },
                    fontFamily: {
                        comfortaa: ['Comfortaa', 'cursive', 'sans-serif'],
                        fredoka: ['Fredoka', 'sans-serif'],
                        quicksand: ['Quicksand', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Comfortaa', 'Quicksand', sans-serif;
            background: radial-gradient(circle at 50% 20%, #ffffff 0%, #ffe1ec 50%, #fcc2d7 100%);
            min-height: 100vh;
            color: #3d091d;
            overflow-x: hidden;
        }

        /* High-Contrast Typography */
        .text-kitty-title {
            color: #4a0924 !important;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
            font-weight: 800;
        }

        .wish-container {
            background-color: #fff0f5;
            border: 2.5px dashed #f76b9a;
            color: #3d091d !important;
            font-weight: 700;
        }

        /* Board Frame with Hugging Kitty Effect */
        .board-frame {
            background: #ffffff;
            border: 4px solid #f76b9a;
            box-shadow: 0 20px 45px rgba(230, 34, 105, 0.25), 0 0 0 6px #ffe1ec;
            border-radius: 36px;
        }

        /* Cute Animated Paw Effect */
        .kitty-paw {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
        }

        .board-frame:hover .kitty-paw {
            transform: scale(1.05);
        }

        /* Floating background particles */
        .floating-item {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: floatUpDown 6s ease-in-out infinite alternate;
        }

        @keyframes floatUpDown {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-20px) rotate(8deg); }
        }

        .btn-kitty {
            background: linear-gradient(135deg, #ff5c8a 0%, #e62269 100%);
            box-shadow: 0 8px 20px rgba(230, 34, 105, 0.35);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-kitty:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(230, 34, 105, 0.45);
        }

        .btn-kitty:active {
            transform: translateY(1px) scale(0.98);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-3 sm:p-6 relative">

    <div class="floating-item top-10 left-6 text-3xl hidden md:block">🎀</div>
    <div class="floating-item top-24 right-10 text-3xl hidden md:block">✨</div>
    <div class="floating-item bottom-20 left-12 text-3xl hidden md:block">🍓</div>
    <div class="floating-item bottom-12 right-12 text-3xl hidden md:block">💖</div>

    <!-- Header Section -->
    <header class="text-center mt-2 mb-4 z-10 max-w-lg">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/90 border-2 border-kitty-300 text-kitty-900 text-xs sm:text-sm font-extrabold shadow-sm mb-2">
            <span>🎀</span>
            <span>Hello Kitty World • Специально для принцесс</span>
            <span>✨</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-kitty-title">
            Привет, девчонки! 💖
        </h1>
        <p class="text-xs sm:text-sm font-bold text-kitty-800 mt-1">
            Hello Kitty держит твою карточку с QR-кодом!
        </p>
    </header>

    <main class="relative w-full max-w-md my-auto pt-16 z-20">
        
        <!-- HELLO KITTY PEEKING HEAD & PAWS (Hugging the board) -->
        <div class="absolute -top-6 left-1/2 -translate-x-1/2 z-30 pointer-events-none flex flex-col items-center">
            
            <!-- Hello Kitty Head SVG Vector -->
            <svg class="w-36 h-28 sm:w-44 sm:h-32 drop-shadow-md" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <path d="M 45 65 L 20 20 C 35 15 65 30 70 45 Z" fill="#FFFFFF" stroke="#3D091D" stroke-width="5" stroke-linejoin="round"/>
                <path d="M 155 65 L 180 20 C 165 15 135 30 130 45 Z" fill="#FFFFFF" stroke="#3D091D" stroke-width="5" stroke-linejoin="round"/>
                
                <!-- Inner Ear Details -->
                <path d="M 38 52 L 28 32 C 38 30 52 40 54 48 Z" fill="#FFE1EC"/>
                <path d="M 162 52 L 172 32 C 162 30 148 40 146 48 Z" fill="#FFE1EC"/>

                <!-- Head Outline -->
                <ellipse cx="100" cy="85" rx="78" ry="55" fill="#FFFFFF" stroke="#3D091D" stroke-width="5.5"/>

                <!-- Eyes -->
                <ellipse cx="65" cy="85" rx="6.5" ry="9.5" fill="#3D091D"/>
                <ellipse cx="135" cy="85" rx="6.5" ry="9.5" fill="#3D091D"/>

                <!-- Nose -->
                <ellipse cx="100" cy="95" rx="7" ry="5" fill="#FFC107" stroke="#3D091D" stroke-width="2"/>

                <!-- Whiskers Left -->
                <path d="M 32 80 L 8 76" stroke="#3D091D" stroke-width="4" stroke-linecap="round"/>
                <path d="M 30 90 L 5 90" stroke="#3D091D" stroke-width="4" stroke-linecap="round"/>
                <path d="M 32 100 L 9 104" stroke="#3D091D" stroke-width="4" stroke-linecap="round"/>

                <!-- Whiskers Right -->
                <path d="M 168 80 L 192 76" stroke="#3D091D" stroke-width="4" stroke-linecap="round"/>
                <path d="M 170 90 L 195 90" stroke="#3D091D" stroke-width="4" stroke-linecap="round"/>
                <path d="M 168 100 L 191 104" stroke="#3D091D" stroke-width="4" stroke-linecap="round"/>

                <!-- Signature Red/Pink Bow -->
                <g id="kitty-bow" transform="translate(132, 42) rotate(12)">
                    <!-- Bow Left Wing -->
                    <path d="M -2,0 C -25,-18 -30,15 -2,5 Z" fill="#E62269" stroke="#3D091D" stroke-width="3.5" stroke-linejoin="round"/>
                    <!-- Bow Right Wing -->
                    <path d="M 2,0 C 25,-18 30,15 2,5 Z" fill="#E62269" stroke="#3D091D" stroke-width="3.5" stroke-linejoin="round"/>
                    <!-- Bow Center Knot -->
                    <circle cx="0" cy="2" r="7.5" fill="#FF5C8A" stroke="#3D091D" stroke-width="3"/>
                </g>
            </svg>
        </div>

        <!-- MAIN CARD BOARD (Being held by Kitty) -->
        <div class="board-frame p-6 sm:p-8 pt-10 relative">
            
            <!-- Paws overlapping top border -->
            <div class="absolute -top-3 left-10 sm:left-14 z-30 kitty-paw">
                <svg class="w-12 h-8" viewBox="0 0 60 40">
                    <ellipse cx="30" cy="20" rx="22" ry="15" fill="#FFFFFF" stroke="#3D091D" stroke-width="4"/>
                    <path d="M 18 22 Q 18 30 24 30" stroke="#FFE1EC" stroke-width="3" stroke-linecap="round"/>
                    <path d="M 30 22 Q 30 31 30 31" stroke="#FFE1EC" stroke-width="3" stroke-linecap="round"/>
                    <path d="M 42 22 Q 42 30 36 30" stroke="#FFE1EC" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="absolute -top-3 right-10 sm:right-14 z-30 kitty-paw">
                <svg class="w-12 h-8" viewBox="0 0 60 40">
                    <ellipse cx="30" cy="20" rx="22" ry="15" fill="#FFFFFF" stroke="#3D091D" stroke-width="4"/>
                    <path d="M 18 22 Q 18 30 24 30" stroke="#FFE1EC" stroke-width="3" stroke-linecap="round"/>
                    <path d="M 30 22 Q 30 31 30 31" stroke="#FFE1EC" stroke-width="3" stroke-linecap="round"/>
                    <path d="M 42 22 Q 42 30 36 30" stroke="#FFE1EC" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="space-y-4 mt-2">
                <div>
                    <label for="url-input" class="block text-xs font-black text-kitty-800 tracking-wider uppercase mb-2 ml-1">
                        ВСТАВЬ СВОЮ ССЫЛКУ НИЖЕ 🎀
                    </label>
                    <div class="relative">
                        <input 
                            type="url" 
                            id="url-input" 
                            placeholder="Ссылка сюда, милая... ♡" 
                            value="https://youtube.com"
                            class="w-full px-4 py-3.5 rounded-2xl bg-kitty-50/60 border-2 border-kitty-300 text-kitty-900 font-bold placeholder-kitty-400 focus:outline-none focus:border-kitty-600 focus:ring-4 focus:ring-kitty-200 transition-all text-sm sm:text-base shadow-inner"
                        >
                        <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xl">🎀</span>
                    </div>
                </div>

                <!-- Generate Action Button -->
                <button 
                    id="generate-btn" 
                    onclick="generateQRCode()" 
                    class="w-full py-4 px-6 rounded-2xl btn-kitty text-white font-black text-base sm:text-lg flex items-center justify-center gap-2 cursor-pointer transition-all active:scale-95"
                >
                    <span>Создать магию ✨</span>
                </button>
            </div>

            <div class="mt-6 pt-5 border-t-2 border-dashed border-kitty-200 flex flex-col items-center">
                
                <div class="p-4 bg-kitty-50 rounded-3xl border-2 border-kitty-300 shadow-sm relative group">
                    <!-- QR Box -->
                    <div id="qrcode-box" class="flex justify-center items-center bg-white p-2 rounded-2xl border border-kitty-200">
                        <!-- QR Code Canvas/Image renders here -->
                    </div>
                </div>

                <!-- Download PNG Button -->
                <button 
                    id="download-btn" 
                    onclick="downloadQRCode()" 
                    class="mt-5 px-6 py-2.5 rounded-full bg-white hover:bg-kitty-100 border-2 border-kitty-300 text-kitty-900 font-extrabold text-xs sm:text-sm flex items-center gap-2 transition-all shadow-sm active:scale-95"
                >
                    <span>Скачать QR-код (PNG) ♡</span>
                </button>
            </div>

            <!-- Bottom Left & Right Decorative Hugging Paws -->
            <div class="absolute -bottom-3 -left-3 text-2xl">🌸</div>
            <div class="absolute -bottom-3 -right-3 text-2xl">🎀</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-3 z-10 text-xs font-black text-kitty-800">
        <p>Hello Kitty QR Generator • 100% Бесплатно для всех девочек 💖</p>
    </footer>

    <div id="success-modal" class="fixed inset-0 bg-kitty-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="relative w-full max-w-sm pt-14 transform scale-90 transition-all duration-300" id="modal-container">
            
            <!-- Hello Kitty Peeking over Modal -->
            <div class="absolute -top-2 left-1/2 -translate-x-1/2 z-30 pointer-events-none">
                <svg class="w-32 h-24" viewBox="0 0 200 150" fill="none">
                    <path d="M 45 65 L 20 20 C 35 15 65 30 70 45 Z" fill="#FFFFFF" stroke="#3D091D" stroke-width="5"/>
                    <path d="M 155 65 L 180 20 C 165 15 135 30 130 45 Z" fill="#FFFFFF" stroke="#3D091D" stroke-width="5"/>
                    <ellipse cx="100" cy="85" rx="78" ry="55" fill="#FFFFFF" stroke="#3D091D" stroke-width="5.5"/>
                    <ellipse cx="65" cy="85" rx="6.5" ry="9.5" fill="#3D091D"/>
                    <ellipse cx="135" cy="85" rx="6.5" ry="9.5" fill="#3D091D"/>
                    <ellipse cx="100" cy="95" rx="7" ry="5" fill="#FFC107" stroke="#3D091D" stroke-width="2"/>
                    <path d="M 32 80 L 8 76" stroke="#3D091D" stroke-width="4"/>
                    <path d="M 168 80 L 192 76" stroke="#3D091D" stroke-width="4"/>
                    <circle cx="132" cy="45" r="8" fill="#E62269" stroke="#3D091D" stroke-width="3"/>
                </svg>
            </div>

            <!-- Modal Content Card -->
            <div class="board-frame p-6 text-center relative z-20">
                
                <!-- High Contrast Title (#3D091D) -->
                <h2 class="text-xl sm:text-2xl font-black text-kitty-900 mb-3 leading-snug">
                    Твой волшебный QR-код готов! 🎉
                </h2>

                <!-- HIGH CONTRAST WISH CONTAINER -->
                <div class="wish-container p-4 rounded-2xl mb-5 text-sm sm:text-base leading-relaxed">
                    <p id="modal-wish-text">
                        <!-- Dynamic Random Cute Wish -->
                    </p>
                </div>

                <!-- Modal Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-2.5">
                    <button 
                        onclick="closeModal()" 
                        class="flex-1 py-3 px-4 rounded-2xl bg-kitty-600 hover:bg-kitty-700 text-white font-black text-sm shadow-md transition-all active:scale-95"
                    >
                        Создать ещё ✨
                    </button>
                    <button 
                        onclick="closeModal()" 
                        class="py-3 px-5 rounded-2xl bg-kitty-900 text-white font-black text-sm shadow-md transition-all active:scale-95"
                    >
                        Закрыть
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Array of cute random wishes (100% dark text readable)
        const cuteWishes = [
            "Ты сегодня выглядишь потрясающе! Пусть этот день принесет только радость! 🌸",
            "У тебя всё получится! Верь в себя, моя хорошая ✨",
            "Время сиять! Пусть твоя ссылка разлетится по всему миру 💕",
            "Маленький шаг к большим мечтам! Обнимаю крепко-крепко 🧸",
            "Пусть твой день будет сладким, как клубничный зефир 🍓"
        ];

        let qrInstance = null;

        // Generate QR Code Function
        function generateQRCode(showModal = true) {
            const urlInput = document.getElementById('url-input').value.trim();
            const qrBox = document.getElementById('qrcode-box');

            if (!urlInput) {
                alert("Пожалуйста, введи ссылку, милая! ♡");
                return;
            }

            // Clear previous QR
            qrBox.innerHTML = '';

            // Generate crisp QR code
            qrInstance = new QRCode(qrBox, {
                text: urlInput,
                width: 170,
                height: 170,
                colorDark: "#3d091d", // Deep readable plum color modules
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            if (showModal) {
                openModal();
            }
        }

        // Open Modal Window
        function openModal() {
            const modal = document.getElementById('success-modal');
            const modalContainer = document.getElementById('modal-container');
            const wishText = document.getElementById('modal-wish-text');

            // Set Random Wish
            const randomWish = cuteWishes[Math.floor(Math.random() * cuteWishes.length)];
            wishText.innerText = randomWish;

            // Animate Modal Entrance
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('scale-90');
            modalContainer.classList.add('scale-100');

            // Trigger Confetti
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { y: 0.65 },
                    colors: ['#e62269', '#ff5c8a', '#faa2c1', '#ffd700']
                });
            }
        }

        // Close Modal Window
        function closeModal() {
            const modal = document.getElementById('success-modal');
            const modalContainer = document.getElementById('modal-container');

            modalContainer.classList.remove('scale-100');
            modalContainer.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Download QR as PNG
        function downloadQRCode() {
            const qrBox = document.getElementById('qrcode-box');
            const img = qrBox.querySelector('img');
            const canvas = qrBox.querySelector('canvas');

            let src = '';
            if (img && img.src) {
                src = img.src;
            } else if (canvas) {
                src = canvas.toDataURL("image/png");
            }

            if (!src) {
                alert("Сначала создайте QR-код!");
                return;
            }

            const a = document.createElement('a');
            a.href = src;
            a.download = 'hello-kitty-qr.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Initial setup
        window.onload = function() {
            // Render default preview QR code on start without popup
            generateQRCode(false);
        };
    </script>
</body>
</html>
